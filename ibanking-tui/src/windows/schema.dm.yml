# IDP catalog schema
# type enum: ui | api | mobile | service
# Convention:
#   - folder        : component root (open IDE here)
#   - srcfolder     : local source code folder
#   - testfolder    : local tests folder
#   - scriptsfolder : local scripts folder
#   - ide           : only meaningful on local environments
#   - urls          : per-environment service links (deployed on remote envs)
#   - compose       : Docker Compose stacks for an environment (built-in actions:
#                     up/down/logs/ps/restart/pull). Mirrors local-menu.sh.

customers:
  - name: IntecLatam
    website: inteclatam.com
    projects:
      - name: crezcamos-enterprise
        folder: /home/sisu/Projects/IntecLatam/intec-banking
        cicd:
          folder: /home/sisu/Projects/IntecLatam/intec-banking/ibanking-cicd
          repo: "https://github.com/inteclatam/ibanking-cicd"
          actions:
            repo: inteclatam/ibanking-cicd
            # workflows: [ci.yml, deploy.yml]   # opcional: filtrar por workflow
          pipelines:
            - {
                name: build-images,
                description: Construye imágenes locales de la plataforma,
                cmd: bash ./docker/_scripts/publish-local-images.sh build all,
                tags: [build, images, local],
              }
            - {
                name: push-images,
                description: Publica imágenes locales al registry configurado,
                cmd: bash ./docker/_scripts/publish-local-images.sh push all,
                tags: [push, images, registry],
              }
            - {
                name: czc-stack-publish-local,
                description: Construye y publica imágenes DockerHub CZC para local dev,
                cmd: DOCKERHUB_REPO=inteclatamcr IMAGE_TAG=local bash ./docker/_scripts/publish-local-images.sh publish czc-stack local,
                tags: [build, push, images, dockerhub, czc, local],
              }
            - {
                name: export-bundle,
                description: Exporta bundle de despliegue Crezcamos pre,
                cmd: ./scripts/export-bank-deploy-bundle.sh --tenant czc --env pre,
                tags: [deploy, bundle, czc, pre],
              }
            - {
                name: deploy-pre,
                description: Ejecuta despliegue pre configurado,
                cmd: ./scripts/deploy.sh pre,
                tags: [deploy, pre],
              }
        environments:
          - name: local
            ide: rider # rider | code | nvim
            urls:
              - name: 🐇 RabbitMQ
                url: http://localhost:15672
              - name: 🛡️ Keycloak Admin
                url: http://localhost:8080/admin
              - name: 📫 Mailpit
                url: http://localhost:8025
              - name: 🏦 Banking UI
                url: http://localhost:3000
              - name: 📖 API Swagger
                url: http://localhost:5000/swagger
              - name: 🗄️ Adminer (Postgres)
                url: http://localhost:8081
            compose:
              # Override env-file at runtime with IBANKING_ENV_FILE.
              dir: /home/sisu/Projects/IntecLatam/intec-banking/ibanking-cicd/docker
              env-file: .env.local
              stacks:
                - name: full-local
                  description: Stack completo local (infra + backend + frontend)
                  files: [compose.local.yml]
                  tags: [local, full, dev]
                - name: full-local-ports
                  description: Stack completo local con puertos de infra expuestos
                  files: [compose.local.yml, compose.local.override.yml]
                  tags: [local, full, ports, dev]
                - name: infra-ports
                  description: Infra + ACME Core local con puertos expuestos al host
                  files:
                    - infra/compose-infra.yml
                    - infra/core/compose.local-acme-core.yml
                    - compose.local.override.yml
                  tags: [local, infra, core, ports, dev]
                - name: acme-core
                  description: ACME Core Banking local desde fuente + infra requerida
                  files:
                    - infra/compose-infra.yml
                    - infra/core/compose.local-acme-core.yml
                  tags: [local, core, infra]
                - name: backend
                  description: Solo microservicios .NET desde fuente
                  files: [backend/compose.local-backend.yml]
                  tags: [local, backend]
                - name: backend-ports
                  description: Backend local + infra + ACME con puertos de infra expuestos
                  files:
                    - backend/compose.local-backend.yml
                    - compose.local.override.yml
                  tags: [local, backend, ports, dev]
                - name: frontend
                  description: Solo frontends Nx/React desde fuente
                  files:
                    - infra/compose-networks.yml
                    - frontend/compose.local-frontends.yml
                  tags: [local, frontend]
                - name: enterprise-banking
                  description: Canal Enterprise Banking publicado (infra + ACME + APIs EB + frontend EB)
                  files: [compose.ibanking-eb.yml]
                  tags: [local, published, eb]
                - name: system-management
                  description: Backoffice System Management publicado (infra + ACME + APIs SM + frontend SM)
                  files: [compose.ibanking-sm.yml]
                  tags: [local, published, sm]
                - name: frontend-eb
                  description: Solo frontends Enterprise Banking
                  files:
                    [
                      frontend/enterprise-banking/compose-frontends-enterprise-banking.yml,
                    ]
                  tags: [local, frontend, eb]
                - name: frontend-sm
                  description: Solo frontends System Management
                  files:
                    [
                      frontend/system-management/compose-frontends-system-management.yml,
                    ]
                  tags: [local, frontend, sm]
                - name: infra-only
                  description: Solo infraestructura (Caddy, Traefik, Keycloak, RabbitMQ, storage, observabilidad)
                  files: [infra/compose-infra.yml]
                  tags: [local, infra]
                - name: infra-only-ports
                  description: Solo infraestructura con puertos expuestos para probar APIs y frontends desde el host
                  files: [infra/compose-infra.yml, compose.local.override.yml]
                  tags: [local, infra, ports, dev]
                - name: support
                  description: Contexto support local (infra + DBs + catalogs/files/notifications)
                  files: [backend/compose.local-support-stack.yml]
                  tags: [local, context, backend]
                - name: iam
                  description: Contexto IAM local (infra + DBs + tenants/profiles/mfa + IntecID)
                  files: [backend/compose.local-iam-stack.yml]
                  tags: [local, context, backend]
                - name: customers
                  description: Contexto customers local (infra + DBs + customers/onboardings)
                  files: [backend/compose.local-customers-stack.yml]
                  tags: [local, context, backend]
                - name: products
                  description: Contexto products local (infra + DBs + products/accounts/loans/investments/cards)
                  files: [backend/compose.local-products-stack.yml]
                  tags: [local, context, backend]
                - name: transactions
                  description: Contexto transactions local (infra + DBs + transactions/payments/transfers/processes)
                  files: [backend/compose.local-transactions-stack.yml]
                  tags: [local, context, backend]
                - name: compliance
                  description: Contexto compliance local (infra + DBs + legals/reports)
                  files: [backend/compose.local-compliance-stack.yml]
                  tags: [local, context, backend]
                - name: integrations
                  description: Contexto integrations local (infra + ACME + DB + Bento ints + API)
                  files: [backend/compose.local-integrations-stack.yml]
                  tags: [local, context, backend, czc]
                - name: czc-real-hub
                  description: Integraciones CZC desde imágenes DockerHub contra Apigee real
                  files: [backend/compose.local-integrations-czc-dockerhub-stack.yml]
                  tags: [local, context, backend, czc, dockerhub, real]
                - name: czc-mock-hub
                  description: Onboarding CZC mock desde imágenes DockerHub
                  files:
                    - backend/compose.local-integrations-czc-dockerhub-stack.yml
                    - backend/integrations/compose.czc-onboarding-e2e-mock-dockerhub.yml
                  tags: [local, context, backend, czc, dockerhub, mock]
                - name: czc-real-onboarding-hub
                  description: Onboarding CZC real desde imágenes DockerHub con monitoreo
                  files:
                    - backend/compose.local-integrations-czc-dockerhub-stack.yml
                    - backend/integrations/compose.czc-onboarding-e2e-mock-dockerhub.yml
                    - backend/integrations/compose.czc-onboarding-platform-apis-dockerhub.yml
                    - backend/integrations/compose.czc-onboarding-e2e-real-dockerhub.yml
                    - infra/monitoring/compose-uptime-kuma.yml
                  tags: [local, context, backend, czc, dockerhub, real, onboarding]
                - name: akamai-external-db-hub
                  description: Stack backend DockerHub con PostgreSQL externo Akamai por túnel SSH local
                  files:
                    - compose.akamai-external-db-hub.yml
                    - compose.akamai-local-tunnel.yml
                  tags: [local, akamai, external-db, dockerhub, tunnel, backend]
          - name: akamai-demo
            urls:
              - name: 🏦 Banking UI
                url: https://demo.crezcamos.inteclatam.com
              - name: 🛡️ Keycloak Admin
                url: https://auth.demo.crezcamos.inteclatam.com/admin
              - name: 📖 API Swagger
                url: https://api.demo.crezcamos.inteclatam.com/swagger
          - name: gcp-crezcamos-pre
